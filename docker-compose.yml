services:
  frontend:
    image: hinokzakir/piraya-vue-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: hinokzakir/piraya-go-backend:latest
    environment:
      - PORT=8080
      - DB_PATH=/data/piraya.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/data
    restart: unless-stopped