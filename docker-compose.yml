services:
  frontend:
    image: hinokzakir/piraya-vue-frontend:latest
    ports:
      - "8081:80"  # Exposes frontend on localhost:8081
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: hinokzakir/piraya-go-backend:latest
    ports:
      - "8082:8080" # Exposes backend on localhost:8082
    environment:
      - PORT=8080
      - DB_PATH=/data/piraya.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/data
    restart: unless-stopped
